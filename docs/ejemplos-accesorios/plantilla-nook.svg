<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -75 120 125" width="240" height="250">
  <!-- Plantilla para dibujar un accesorio sobre Nook. El (0, 0) del dibujo es el centro de su
       cuerpo: mide 98 de ancho (de -49 a 49), llega a -39 por arriba y a 37,5 por abajo; los
       ojos están en (±13, 0) y la boca en (0, 15).
       Dibuja tu accesorio encima, borra los trazados de la plantilla (la silueta gris, el rulo y
       las guías) y guarda el resultado como accesorio.svg en la carpeta de tu accesorio. -->
  <path id="plantilla-cuerpo" d="M -40 -30 C -20 -42 20 -42 40 -30 C 52 -20 52 20 40 30 C 20 40 -20 40 -40 30 C -52 20 -52 -20 -40 -30 Z" fill="#f0f0f0" opacity="0.6"/>
  <path id="plantilla-rulo" d="M 0 -36 C -4 -56 14 -64 20 -54 C 25 -45 12 -40 10 -48" fill="none" stroke="#d0d0d0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle id="plantilla-ojo-izquierdo" cx="-13" cy="0" r="7" fill="none" stroke="#c0c0c0" stroke-width="1.5"/>
  <circle id="plantilla-ojo" cx="13" cy="0" r="7" fill="none" stroke="#c0c0c0" stroke-width="1.5"/>
  <circle id="plantilla-boca" cx="0" cy="15" r="5" fill="none" stroke="#c0c0c0" stroke-width="1.5"/>
  <line id="plantilla-coronilla" x1="-30" y1="-39" x2="30" y2="-39" stroke="#c0c0c0" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
