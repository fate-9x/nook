<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -70 140 125">
  <!-- Mochi: una bola con la base algo plana. Centro del cuerpo en (0, 0), ~100 de ancho. -->
  <path id="cuerpo" d="M -48 18 C -52 -20 -28 -42 0 -42 C 28 -42 52 -20 48 18 C 46 34 28 38 0 38 C -28 38 -46 34 -48 18 Z" fill="#7ec8e3"/>
  <!-- Pintado en la cara (tipo por defecto): gira con ella y nunca se sale del cuerpo. -->
  <ellipse id="brillo" cx="-24" cy="-24" rx="9" ry="5" transform="rotate(-30 -24 -24)" fill="#ffffff" fill-opacity="0.55"/>
  <g id="mejillas" fill="#ff9eb5">
    <ellipse cx="-27" cy="10" rx="7" ry="4"/>
    <ellipse cx="27" cy="10" rx="7" ry="4"/>
  </g>
  <!-- Solo el ojo DERECHO (x positiva): el izquierdo es su reflejo. Relleno: al estar contento
       se vuelve un arco solo. El brillo blanco va en el mismo grupo para que parpadee con él. -->
  <g id="ojo">
    <ellipse cx="16" cy="0" rx="5" ry="6.5" fill="#1d2b3a"/>
    <circle cx="17.8" cy="-2.4" r="1.7" fill="#ffffff"/>
  </g>
  <path id="boca" d="M -6 11 Q -3 15 0 11 Q 3 15 6 11" fill="none" stroke="#1d2b3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
