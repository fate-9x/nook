<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -100 140 165" width="280" height="330">
  <!-- Trucos: un personaje que usa todas las opciones del motor (ver docs/personajes.md).
       Lo verde claro es el cuerpo y el remolino (toma el color de acento); lo azul oscuro son los
       rasgos (toma el color que se lee sobre el acento); las franjas de pelo son verdes. -->
  <path id="pelo-atras" d="M -42 -8 C -42 -40 42 -40 42 -8 C 42 -4 40 -2 38 -4 C 30 -22 -30 -22 -38 -4 C -40 -2 -42 -4 -42 -8 Z" fill="#3d8f6e"/>
  <path id="oreja-izquierda" d="M -38 -22 L -46 -44 L -22 -34 Z" fill="#4ab3c9" stroke="#123a44" stroke-width="2" stroke-linejoin="round"/>
  <path id="oreja-derecha" d="M 38 -22 L 46 -44 L 22 -34 Z" fill="#4ab3c9" stroke="#123a44" stroke-width="2" stroke-linejoin="round"/>
  <circle id="cuerpo" r="40" fill="#4ab3c9"/>
  <path id="remolino" d="M -10 -37 C -10 -52 10 -52 10 -37 Z" fill="#4ab3c9" stroke="#123a44" stroke-width="2"/>
  <path id="barriga" d="M -36 14 L 36 14" fill="#d9f0f4"/>
  <g id="mejillas">
    <ellipse cx="-22" cy="8" rx="6" ry="3.6" fill="#f2b3ad"/>
    <ellipse cx="22" cy="8" rx="6" ry="3.6" fill="#f2b3ad"/>
  </g>
  <path id="nuca-izquierda" d="M -14 -40 C -26 -38 -33 -28 -32 -14 L -32 0 L -40 8" fill="#3d8f6e" stroke="#123a44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="nuca-derecha" d="M 14 -40 C 26 -38 33 -28 32 -14 L 32 0 L 40 8" fill="#3d8f6e" stroke="#123a44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle id="ojo" cx="14" cy="-2" r="4" fill="#123a44"/>
  <path id="ojo-izquierdo" d="M -18 -2 A 4 4 0 0 1 -10 -2 Z" fill="#123a44"/>
  <path id="ojo-alegre" d="M 9 -1 Q 14 -7 19 -1" fill="none" stroke="#123a44" stroke-width="2.2" stroke-linecap="round"/>
  <g id="boca">
    <path d="M -7 12 Q 0 19 7 12" fill="none" stroke="#123a44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 1.6 15.9 L 3.4 20.2 L 5 14.6 Z" fill="#ffffff"/>
  </g>
  <path id="flequillo" d="M -40 -26 C -22 -40 22 -40 40 -26" fill="#3d8f6e" stroke="#123a44" stroke-width="2" stroke-linecap="round"/>
  <path id="hoja" d="M 10 -38 C 4 -50 18 -52 18 -44 C 18 -40 14 -37 10 -38 Z" fill="#3d8f6e" stroke="#123a44" stroke-width="1.5"/>
  <g id="antena">
    <path d="M 0 -38 C 0 -52 4 -54 6 -58" fill="none" stroke="#123a44" stroke-width="2" stroke-linecap="round"/>
    <circle cx="7" cy="-60" r="3.5" fill="#e0455a"/>
  </g>
  <!-- Las anclas no se dibujan: marcan sitios. -->
  <circle id="ancla-cuerpo" cx="0" cy="0" r="1.5" fill="none"/>
  <circle id="ancla-ojo" cx="14" cy="-2" r="1.5" fill="none"/>
  <circle id="ancla-boca" cx="0" cy="14" r="1.5" fill="none"/>
  <circle id="ancla-muelle" cx="0" cy="-30" r="1.5" fill="none"/>
  <circle id="ancla-pelo-atras" cx="0" cy="-30" r="1.5" fill="none"/>
  <circle id="ancla-oreja-izquierda" cx="-33" cy="-31" r="1.5" fill="none"/>
  <circle id="ancla-oreja-derecha" cx="33" cy="-31" r="1.5" fill="none"/>
  <circle id="ancla-hoja" cx="10" cy="-38" r="1.5" fill="none"/>
  <circle id="ancla-antena" cx="0" cy="-38" r="1.5" fill="none"/>
</svg>
