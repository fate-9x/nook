<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" width="240" height="240">
  <!-- Lo mínimo: un personaje sin personaje.json. Basta con el cuerpo, un ojo y una boca, cada
       uno con su nombre. Nookly hace el resto: el ojo izquierdo es el reflejo del derecho,
       parpadea, se sorprende con los avisos, salta al hacerle clic y baila con la música. -->
  <circle id="cuerpo" r="40" fill="#3cb371"/>
  <circle id="ojo" cx="13" cy="0" r="4" fill="#0b1230"/>
  <path id="boca" d="M -6 12 Q 0 18 6 12" fill="none" stroke="#0b1230" stroke-width="2" stroke-linecap="round"/>
</svg>
