<svg xmlns="http://www.w3.org/2000/svg" viewBox="-75 -95 150 150">
  <!-- Fresa: el cuerpo con forma de fruta, más ancho arriba. Centro en (0, 0), ~100 de ancho. -->
  <path id="cuerpo" d="M 0 -36 C 30 -44 52 -30 48 -6 C 44 18 22 38 0 40 C -22 38 -44 18 -48 -6 C -52 -30 -30 -44 0 -36 Z" fill="#ff4d5e"/>
  <!-- Las semillas y el brillo van pintados en la cara. -->
  <g id="semillas" fill="#ffe08a">
    <ellipse cx="-30" cy="-14" rx="1.6" ry="2.4"/>
    <ellipse cx="30" cy="-14" rx="1.6" ry="2.4"/>
    <ellipse cx="-36" cy="6" rx="1.6" ry="2.4"/>
    <ellipse cx="36" cy="6" rx="1.6" ry="2.4"/>
    <ellipse cx="-20" cy="26" rx="1.6" ry="2.4"/>
    <ellipse cx="20" cy="26" rx="1.6" ry="2.4"/>
    <ellipse cx="0" cy="32" rx="1.6" ry="2.4"/>
    <ellipse cx="-8" cy="-26" rx="1.6" ry="2.4"/>
    <ellipse cx="8" cy="-26" rx="1.6" ry="2.4"/>
  </g>
  <ellipse id="brillo" cx="-28" cy="-24" rx="7" ry="4" transform="rotate(-25 -28 -24)" fill="#ffffff" fill-opacity="0.5"/>
  <!-- Las hojas de arriba: tipo «cabeza» con muelle, en la frente. El ancla, abajo en medio. -->
  <path id="hojas" d="M 0 -36 C -8 -46 -18 -46 -23 -39 C -15 -37 -10 -35 -5 -32 C -9 -40 -5 -48 0 -50 C 5 -48 9 -40 5 -32 C 10 -35 15 -37 23 -39 C 18 -46 8 -46 0 -36 Z" fill="#3fae5a"/>
  <circle id="ancla-hojas" cx="0" cy="-35" r="1" fill="none"/>
  <!-- El rabito: algo que asoma al mirar hacia él ("delante": "revelar"). -->
  <path id="rabito" d="M 0 -46 C 0 -52 2 -56 6 -60" fill="none" stroke="#2f7d44" stroke-width="3" stroke-linecap="round"/>
  <circle id="ancla-rabito" cx="0" cy="-46" r="1" fill="none"/>
  <g id="ojo">
    <ellipse cx="15" cy="-6" rx="4.5" ry="6" fill="#3a1418"/>
    <circle cx="16.6" cy="-8.2" r="1.6" fill="#ffffff"/>
  </g>
  <path id="boca" d="M -5 6 Q 0 11 5 6" fill="none" stroke="#3a1418" stroke-width="2" stroke-linecap="round"/>
</svg>
